<h1>Backend local</h1>
@if (productService.productsResource.isLoading()) {
    <div>Se esta ejecutando la petición</div>
}
@if (productService.productsResource.error()) {
    <div>{{ productService.errorMessage() }}</div>
}
@if (productService.productsResource.hasValue()) {
    <div>{{ productService.productsResource.value() | json }}</div>
}
